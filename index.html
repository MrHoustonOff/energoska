<!doctype html>
<html lang="ru" data-perf="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Энергоська">
  <!-- НЕ black-translucent: в iOS 26 он урезает окно на высоту статус-бара (WebKit #301108), снизу чёрная полоса, CSS её не лечит.
       black = окно во весь экран, статус-бар непрозрачный чёрный (совпадает с тёмным фоном). Читается только при установке: иконку пересоздать. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <title>Энергоська</title>

  <!-- Критичный фон до загрузки любых файлов: без вспышки и полос при холодном старте -->
  <style>
    html, body { margin: 0; background: #000; }
    @media (prefers-color-scheme: light) { html, body { background: #f4f4f1; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
