<style>
html,body{margin:0;background:#000;color:#fff;font:14px system-ui}
#w{position:fixed;top:0;left:0;right:0;height:var(--h,100%);box-sizing:border-box;display:flex;flex-direction:column;padding:56px 16px 0;background:#000}
.top{flex:1 1 auto;min-height:0;overflow-y:auto}
.bot{flex:none;padding:8px 0 max(env(safe-area-inset-bottom),12px);background:#111;margin:0 -16px;padding-left:16px;padding-right:16px;border-top:1px solid #444}
input,textarea{display:block;width:100%;box-sizing:border-box;font-size:16px;padding:12px;margin:8px 0;background:#fff;color:#000;border:1px solid #888;border-radius:12px}
a{color:#b6ff3d;display:inline-block;margin:6px 12px 6px 0;font-size:16px}pre{font:12px/1.5 monospace;white-space:pre-wrap;margin:8px 0}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}input,textarea{-webkit-user-select:text;user-select:text}html{overscroll-behavior:none}body{position:fixed;inset:0;overflow:hidden}input,textarea{min-height:44px;appearance:none;-webkit-appearance:none;outline:none;font-family:-apple-system,system-ui}.top{overscroll-behavior:contain;scrollbar-width:none}#w{position:absolute}</style></head><body>
<div id="w"><div class="top"><b>Тест 7: чисто как приложение: 6 + нет position:fixed у #w</b><br>
<a href="/kb/">← список</a><a href="/">← приложение</a>
<pre id="m"></pre><pre id="l"></pre>
<div style="height:600px"></div>низ прокручиваемой части</div>
<div class="bot"><input id="i1" placeholder="input (внизу)" autocomplete="off"><textarea id="i2" placeholder="textarea (внизу)" rows="2"></textarea></div></div>
<script>
const L=[],l=document.getElementById('l'),m=document.getElementById('m'),vv=window.visualViewport,w=document.getElementById('w');
const g=x=>{L.unshift(x);L.length=Math.min(L.length,7);l.textContent=L.join('\n')};
['pointerdown','focusin','focusout'].forEach(e=>document.addEventListener(e,x=>g(e+' '+x.target.tagName+(x.target.id?'#'+x.target.id:'')),true));
const edit=()=>/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
let gap=0;
function size(){
  if(!edit()){const long=Math.max(screen.width,screen.height),short=Math.min(screen.width,screen.height);
    const gp=Math.round((innerHeight>=innerWidth?long:short)-innerHeight);gap=(navigator.standalone===true&&gp>0&&gp<=80)?gp:0}
  const h=Math.round(vv.height+vv.offsetTop+(edit()?0:gap));w.style.setProperty('--h',h+'px');
  m.textContent='inner '+innerWidth+'x'+innerHeight+'  screen '+screen.height+'  vv '+Math.round(vv.height)+' @'+Math.round(vv.offsetTop)+'  gap '+gap+'  h '+h;
}
vv.addEventListener('resize',size);vv.addEventListener('scroll',size);document.addEventListener('focusin',size);document.addEventListener('focusout',()=>setTimeout(size,60));size();
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('pointerdown',e=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&!/INPUT|TEXTAREA/.test(e.target.tagName))a.blur()});document.addEventListener('focusout',()=>setTimeout(()=>{if(!edit())scrollTo(0,0)},60));</script></body></html>
